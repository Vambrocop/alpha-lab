name: Weekly review (LLM 本周回顾)

# 「本周回顾」周报：交易周结束后（周六）总结本 ISO-week(Mon–Sun) 的市场环境与倾向变化。
# 为何周六不是周一：llm_weekly_read 取【当前 ISO-week】的 composite_log 行，而 composite 只在
# 工作日(Mon–Fri)写 → 周六跑能拿到完整一周(coverage 充分)；周一跑当前周几乎为空(不足3天)。
# 读的都是已提交的真实算出数据(composite_log/market_regime/scorecard/valpha150)；
# 未配 LLM key 时脚本静默跳过、不写文件 → 本工作流 commit 步会自然 no-op。
on:
  schedule:
    - cron: "0 14 * * 6"    # 周六 14:00 UTC（交易周已收，含完整 Mon–Fri 读数）
  workflow_dispatch: {}     # 手动触发按钮

permissions:
  contents: write

concurrency:
  group: weekly-review
  cancel-in-progress: false

jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install core deps (pandas 等)
        run: pip install -r market-analysis/requirements-core.txt

      - name: Generate weekly review (本周回顾)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}     # 未配置则脚本静默跳过、不写文件
          LLM_PROVIDER: ${{ secrets.LLM_PROVIDER }}          # 可选：openai 兼容(DeepSeek 等)
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}   # 周报推送(未配置静默跳过)
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python market-analysis/scripts/llm_weekly_read.py

      - name: Commit & push if changed
        # 同 refresh-data:发布逻辑走 tools/ci_publish.py(显式暂存 + 可本地测 + 门只警告)。
        # 没配 LLM key 时周报无产出 → 脚本安静跳过并返回 0,这是**正常路径**不是失败。
        run: |
          python tools/ci_publish.py             --message "data: LLM 本周回顾 [skip ci]"             --guard tools/ci_ledger_guard.py             --empty-note "周报无变化(多半是没配 LLM key),跳过提交"
