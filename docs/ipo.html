  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px;margin-top:6px}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:11px 13px;position:relative}
  .card .co{font-weight:700;font-size:.98rem;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
  .card .tk{font-size:.7rem;color:var(--mut);border:1px solid var(--border);border-radius:5px;padding:1px 6px;font-family:ui-monospace,monospace}

  .card .sec{font-size:.74rem;color:var(--mut);margin:3px 0 6px}

  .t-filed .card{border-left:3px solid #58a6ff}

  .t-rumor .card{border-left:3px dashed var(--mut);opacity:.82;background:repeating-linear-gradient(135deg,var(--panel),var(--panel) 9px,rgba(139,148,158,.04) 9px,rgba(139,148,158,.04) 18px)}

  .t-listing .card{border-left:4px solid var(--grn);box-shadow:0 0 0 1px rgba(63,185,80,.12) inset}

  .t-adr .card{border-left:3px dashed var(--mut);opacity:.78}

  .tier-major .tag{background:rgba(248,81,73,.16);color:var(--red);border:1px solid var(--red);font-weight:700}

  .badge-notable{background:rgba(227,160,8,.16);color:var(--amber);border:1px solid var(--amber)}

  .mut{color:var(--mut);font-size:.78rem;margin-top:20px;border-top:1px solid var(--border);padding-top:8px}

// 策展三档快照月份（人工维护，随策展内容更新时同步改）；>2 个月自动提醒渐旧，≤2 个月不打扰。
const CURATED_ASOF="2026-06";
function monthsSinceAsof(asof){
  const m=/^(\d{4})-(\d{2})$/.exec(asof); if(!m) return 0;
  const y=+m[1], mo=+m[2];
  const now=new Date();
  return Math.max(0,(now.getFullYear()-y)*12+(now.getMonth()-(mo-1)));
}
function staleBanner(){
  const n=monthsSinceAsof(CURATED_ASOF);
  if(n<=2) return "";
  const msg=t("staleWarn").replace("{ASOF}",CURATED_ASOF).replace("{N}",n);
  return `<div class="stale-warn">${msg}</div>`;
}

function L(field){return (field && field[LANG]) || (field && field.zh) || "";}

// ---- auto section: read SEC EDGAR live filings (fetched by fetch_ipo.py) ----
let AUTO=null;   // ipo_filings.json payload, or null if unavailable

const BUCKETS=["listing","priced","filed","adr"];   // 显示优先级（越确定越靠前）

// $M → "$1.2B" / "$913M"
function fmtUsdM(m){return m>=1000?`$${(m/1000).toFixed(2)}B`:`$${Math.round(m)}M`;}

function reasonChips(r){
  const rs=r.tier_reasons||[]; let c="";
  const chip=(cls,txt)=>`<span class="rc ${cls}">${esc(txt)}</span>`;
  if(rs.includes("watchlist")) c+=chip("rc-watch",t("rcWatch"));
  // 决定1：母市值只标档位（过 $10B 档），不亮精确数——精确数留在 JSON 的 home_mktcap_usd_b 字段供审计。
  if(rs.includes("home_mktcap"))
    c+=chip("rc-cap",t("rcCap").replace("{TICKER}",r.home_ticker||""));
  // R1：金额芯片不再要求 tier_reasons 含 "amount"——major-by-mktcap/watchlist 的公司若也有
  // parsed 的 SEC 费表金额（如 SK hynix）同样亮出来，不因短路省了 SEC 而丢掉可核数字。
  if(r.amount_status==="parsed"&&r.amount_usd_m!=null)
    c+=chip("rc-amt",`${t("rcAmt")} ${fmtUsdM(r.amount_usd_m)}`);
  if(rs.includes("foreign_unknown")) c+=chip("rc-fgn",t("rcFgn"));
  if(r.amount_status==="placeholder_suspect") c+=chip("rc-ph",t("rcPh"));
  return c;
}
function tierBadge(r){
  if(r.tier==="major") return `<span class="badge badge-major">${esc(t("badgeMajor"))}</span>`;
  if(r.tier==="notable") return `<span class="badge badge-notable">${esc(t("badgeNotable"))}</span>`;
  if(r.enrich==="deferred") return `<span class="badge badge-unlayered">${esc(t("badgeDeferred"))}</span>`;
  return "";   // rest / adr_unlayered / 未富化 → 不打扰
}
// 跨档按 CIK 去重、取最靠前(最确定)那条，收集某 tier 的公司
function collectTier(tierName){
  const seen=new Set(), out=[];
  BUCKETS.forEach(b=>(AUTO[b]||[]).forEach(r=>{
    if(r.tier===tierName && r.cik && !seen.has(r.cik)){seen.add(r.cik);out.push(r);}
  }));
  return out;
}

function renderAuto(){
  const box=$("autoipo"); if(!box) return;
  if(!AUTO){ box.innerHTML=`<p class="sub">${esc(t("autoNone"))}</p>`; return; }
  const stamp=(AUTO.generated||"").slice(0,10);
  const enriched = !!AUTO.tier_rules;   // 富化跑过才有分层字段
  const cardsHtml=rows=>{
    let h=`<div class="grid">`;
    rows.forEach(r=>{
      h+=`<div class="card"><div class="co">${esc(r.company||"")}`;
      h+= r.ticker ? `<span class="tk">${esc(r.ticker)}</span>` : `<span class="tk" style="opacity:.6">${esc(t("autoNoTk"))}</span>`;
      if(r.foreign===true) h+=`<span class="fg">${esc(t("foreignTag"))}</span>`;
      if(enriched) h+=tierBadge(r);
      h+=`</div>`;
      h+=`<div class="det">${esc(r.form||"")} · ${esc(r.filed||"")}</div>`;
      h+=`</div>`;
    });
    h+=`</div>`;
    return h;
  };
  const block=(rows,head,sub,cls)=>{
    let h=`<section class="${cls}">`;
    h+=`<h2 class="tier" style="font-size:.95rem">${esc(t(head))}<span class="tag">${esc(rows.length)}</span></h2>`;
    h+=`<p class="sub">${esc(t(sub))}</p>`;
    h+=cardsHtml(rows);
    h+=`</section>`;
    return h;
  };
  const tierGroup=(name,headK,subK,cls)=>{
    const rows=collectTier(name);
    let h=`<section class="${cls}" style="margin-top:8px">`;
    h+=`<h2 class="tier" style="font-size:1rem">${esc(t(headK))}<span class="tag">${esc(rows.length)}</span></h2>`;
    h+=`<p class="sub">${esc(t(subK))}</p>`;
    if(rows.length===0){ h+=`<p class="sub" style="opacity:.85">${esc(t("tierNone"))}</p>`; }
    else{ h+=`<div class="grid">`; rows.forEach(r=>{
      h+=`<div class="card"><div class="co">${esc(r.company||"")}`;
      h+= r.ticker ? `<span class="tk">${esc(r.ticker)}</span>` : "";
      if(r.foreign===true) h+=`<span class="fg">${esc(t("foreignTag"))}</span>`;
      h+=`</div><div class="det">${esc(r.form||"")} · ${esc(r.filed||"")}</div>`;
      h+=`<div>${reasonChips(r)}</div></div>`;
    }); h+=`</div>`; }
    h+=`</section>`;
    return h;
  };

  let h="";
  // ── A2：先列 🔴 major / 🟡 notable 汇总组 + 分层规则公示 ──
  if(enriched){
    h+=tierGroup("major","majorHead","majorSub","tier-major");
    h+=tierGroup("notable","notableHead","notableSub","tier-notable");
    const rules=(AUTO.tier_rules&&AUTO.tier_rules[LANG])||AUTO.tier_rules.zh||"";
    h+=`<details class="vp-more" style="margin-top:10px"><summary>${esc(t("tierRulesToggle"))}</summary>`;
    h+=`<div class="rules-box">${esc(rules)}</div></details>`;
    h+=`<h2 class="tier" style="font-size:.9rem;margin-top:26px;color:var(--mut)">${esc(t("fullStreamHead"))}</h2>`;
  }
  // 已注册挂牌（8-A12B）——高信号，放在最显眼位置
  h+=block(AUTO.listing||[], "autoListing", "autoListingSub", "t-listing");
  h+=block(AUTO.priced||[], "autoPriced", "autoPricedSub", "t-listed");
  h+=block(AUTO.filed||[],  "autoFiled",  "autoFiledSub",  "t-filed");
  // ADR 存托设施（F-6）——噪音大、多为程序性，隔离进可折叠区、默认收起、低调样式
  const adrRows=AUTO.adr||[];
  h+=`<details class="vp-more t-adr" style="margin-top:14px">`;
  h+=`<summary>${esc(t("autoAdrToggle").replace("{N}", adrRows.length))}</summary>`;
  h+=`<p class="sub" style="margin-top:8px">${esc(t("autoAdrSub"))}</p>`;
  h+=cardsHtml(adrRows);
  h+=`</details>`;
  if(stamp) h+=`<p class="sub" style="margin-top:10px">${esc(t("autoStamp"))} ${esc(stamp)} <span style="opacity:.75">(${esc(t("autoStampWhy"))})</span></p>`;
  box.innerHTML=h;
}

function loadAuto(){
  fetch("ipo_filings.json",{cache:"no-store"})
    .then(r=>r.ok?r.json():null)
    .then(d=>{AUTO=(d&&Array.isArray(d.filed)&&Array.isArray(d.priced))?d:null;renderAuto();})
    .catch(()=>{AUTO=null;renderAuto();});
}

// ---- A5: major IPO post-listing fact sheet (reads ipo_aftermath.json) ----
let AFTERMATH=null;

function fmtPct(v){
  if(v==null) return `<span class="am-pending">${esc(t("amPending"))}</span>`;
  const cls=v>0?"am-pos":(v<0?"am-neg":"");
  return `<span class="${cls}">${v>0?"+":""}${v.toFixed(1)}%</span>`;
}
function qualityBadge(q){
  if(q==="lead") return `<span class="am-quality am-q-lead" title="${esc(t("amQLeadNote"))}">${esc(t("amQLead"))}</span>`;
  if(q==="late") return `<span class="am-quality am-q-late" title="${esc(t("amQLateNote"))}">${esc(t("amQLate"))}</span>`;
  if(q==="missed") return `<span class="am-quality am-q-missed" title="${esc(t("amQMissedNote"))}">${esc(t("amQMissed"))}</span>`;
  return "";
}
function leadDaysTxt(n){
  if(n==null) return "";
  return n>=0 ? t("amLeadDays").replace("{N}",n) : t("amLateDays").replace("{N}",Math.abs(n));
}
function renderAftermath(){
  const box=$("aftermath"); if(!box) return;
  const rows=(AFTERMATH&&Array.isArray(AFTERMATH.companies))?AFTERMATH.companies:[];
  if(!AFTERMATH||rows.length===0){ box.innerHTML=`<p class="sub">${esc(t("amNone"))}</p>`; return; }
  const cav=AFTERMATH.caveat||{};
  let h=`<div class="note">${t("amCaveat")}${esc(L(cav)||"")}`
       +(cav.source?` <span style="opacity:.75">(${esc(cav.source)})</span>`:"")+`</div>`;
  h+=`<div class="grid" style="margin-top:10px">`;
  rows.forEach(r=>{
    h+=`<div class="card am-card"><div class="co">${esc(r.company||"")}`;
    if(r.ticker) h+=`<span class="tk">${esc(r.ticker)}</span>`;
    h+=qualityBadge(r.alert_quality);
    h+=`</div>`;
    h+=`<div class="sec">${esc(t("amFirstTrade"))}: ${esc(r.first_trade_date||"?")}`
      +(r.alert_lead_days!=null?` · ${esc(t("amLeadLabel"))} ${esc(leadDaysTxt(r.alert_lead_days))}`:"")+`</div>`;
    h+=`<div class="metrics">`;
    h+=`<div class="metric"><b>${esc(t("amD1"))}</b><span>${fmtPct(r.d1_pct)}</span></div>`;
    h+=`<div class="metric"><b>${esc(t("amD5"))}</b><span>${fmtPct(r.d5_pct)}</span></div>`;
    h+=`<div class="metric"><b>${esc(t("amD20"))}</b><span>${fmtPct(r.d20_pct)}</span></div>`;
    h+=`<div class="metric"><b>${esc(t("amVsQqq"))}</b><span>${fmtPct(r.vs_qqq_d20_pct)}</span></div>`;
    h+=`</div></div>`;
  });
  h+=`</div>`;
  const stamp=(AFTERMATH.generated||"").slice(0,10);
  if(stamp) h+=`<p class="sub" style="margin-top:10px">${esc(t("amStamp"))} ${esc(stamp)}</p>`;
  h+=`<p class="sub" style="margin-top:4px">${esc(t("amDisclaimer"))}</p>`;
  box.innerHTML=h;
}
function loadAftermath(){
  fetch("ipo_aftermath.json",{cache:"no-store"})
    .then(r=>r.ok?r.json():null)
    .then(d=>{AFTERMATH=(d&&Array.isArray(d.companies))?d:null;renderAftermath();})
    .catch(()=>{AFTERMATH=null;renderAftermath();});
}

function redraw(){applyStatic();render();renderAuto();renderAftermath();}
$("lang").onclick=()=>{LANG=LANG==="zh"?"en":"zh";try{localStorage.setItem("valpha_lang",LANG)}catch(e){};redraw();};

redraw();

loadAftermath();
